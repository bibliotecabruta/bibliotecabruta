<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo — Biblioteca Bruta</title><link rel="stylesheet" href="style.css?v=20260824-2"></head><body><header class="topbar"><nav class="nav"><a class="brand" href="index.html">BIBLIOTECA <b>BRUTA</b></a><a href="historica.html">Ficção Histórica</a><a href="colecao-negra.html">Coleção Negra</a><a href="militar.html">Ficção Militar</a><a href="autores.html">Autores</a><a href="series.html">Séries</a><a href="categorias.html">Categorias</a><a href="temas.html">Temas</a><a href="admin.html">Admin</a></nav></header><section class="pagehead"><h1>Catálogo</h1><p class="muted">Combine filtros para garimpar o acervo da Biblioteca Bruta.</p></section><main><section class="filter-panel"><div class="filter-grid"><div class="field"><label>Pesquisar</label><input id="filterQ" placeholder="Título, autor, série, editora..." oninput="applyCatalogFilters()"></div><div class="field"><label>Área</label><select id="filterArea" onchange="onAreaFilterChange()"><option value="">Todas as áreas</option><option>Ficção Histórica</option><option>Coleção Negra</option><option>Ficção Militar</option><option>Fantasia</option><option>Ficção Científica</option><option>Policial/Mistério</option></select></div><div class="field"><label>Categoria</label><select id="filterCategory" onchange="applyCatalogFilters()"><option value="">Todas as categorias</option></select></div><div class="field"><label>Tema</label><select id="filterTag" onchange="applyCatalogFilters()"><option value="">Todos os temas</option></select></div><div class="field"><label>Autor</label><select id="filterAuthor" onchange="applyCatalogFilters()"><option value="">Todos os autores</option></select></div><div class="field"><label>Série</label><select id="filterSeries" onchange="applyCatalogFilters()"><option value="">Todas as séries</option></select></div><div class="field"><label>Tipo ou situação no Brasil</label><select id="filterStatus" onchange="applyCatalogFilters()"><option value="">Todos</option><option>Completa</option><option>Interrompida</option><option>Em andamento</option><option>Volume único</option></select></div><div class="field"><label>Ordenar por</label><select id="filterSort" onchange="applyCatalogFilters()"><option value="title">Título A–Z</option><option value="author">Autor A–Z</option><option value="br_newest">Publicação BR mais recente</option><option value="br_oldest">Publicação BR mais antiga</option><option value="recent_added">Adicionados recentemente</option></select></div></div><div class="filter-footer"><div id="filterSummary" class="muted">Carregando catálogo…</div><button class="secondary" type="button" onclick="clearCatalogFilters()">Limpar filtros</button></div></section><section id="activeFilters" class="active-filters"></section><section id="filteredCatalog" class="grid"></section></main><footer class="footer"><div class="footer-inner"><strong>BIBLIOTECA BRUTA</strong><span>Catálogos para quem ainda gosta de garimpar livros.</span></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="catalogo.js?v=20260824-2"></script><script src="catalogo-volume-ui.js?v=20260824-2"></script></body></html>
