<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Biblioteca Bruta</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><nav class="nav"><a class="brand" href="index.html">BIBLIOTECA <b>BRUTA</b></a><a href="index.html">Ver site</a></nav></header><div class="admin-wrap"><section id="loginPanel" class="panel login"><h1>Administração</h1><p class="muted">Entre com a conta administrativa da Biblioteca Bruta.</p><form onsubmit="login(event)"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field" style="margin-top:12px"><label>Senha</label><input name="password" type="password" required></div><div class="actions"><button class="primary">Entrar</button></div></form></section><section id="adminPanel" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><div><h1>Painel Biblioteca Bruta</h1><div class="muted">Conectado como <span id="adminEmail"></span></div></div><button class="secondary" onclick="logout()">Sair</button></div><div id="status" class="note hidden"></div><div class="admin-grid"><aside class="sidebar"><h3>Conteúdo</h3><button>📚 Livros</button><button>✍️ Autores</button><button>📖 Séries</button><button>🏷️ Categorias</button><button>🏛️ Coleções</button><button>📰 Notícias</button><button>🖼️ Edições</button></aside><div class="panel"><h2>Adicionar livro</h2><form onsubmit="saveBook(event)"><div class="form-grid"><div class="field"><label>Título brasileiro</label><input name="title" required></div><div class="field"><label>Título original</label><input name="original_title"></div><div class="field"><label>Autor</label><input name="author" required></div><div class="field"><label>Série</label><input name="series"></div><div class="field"><label>Volume</label><input name="series_volume" type="number" min="1"></div><div class="field"><label>Área</label><select name="area"><option>Ficção Histórica</option><option>Coleção Negra</option><option>Ficção Militar</option></select></div><div class="field"><label>Categoria</label><select id="categoryId" name="category_id"></select></div><div class="field"><label>Ano original</label><input name="original_year" type="number"></div><div class="field full"><label>Sinopse / descrição</label><textarea name="synopsis"></textarea></div><div class="field full"><label>Capa principal</label><input name="cover_file" type="file" accept="image/jpeg,image/png,image/webp"><small class="muted">JPG, PNG ou WebP, até 5 MB.</small></div><div class="field"><label>Coleção editorial</label><select id="collectionId" name="collection_id"></select></div><div class="field"><label>Número na coleção</label><input name="collection_number"></div><div class="field"><label>Editora da edição BR</label><input name="publisher"></div><div class="field"><label>Ano da edição BR</label><input name="publication_year" type="number"></div><div class="field"><label>ISBN</label><input name="isbn"></div><div class="field"><label>Tradutor</label><input name="translator"></div><div class="field full"><label>Capa específica desta edição (opcional)</label><input name="edition_cover_file" type="file" accept="image/jpeg,image/png,image/webp"></div></div><div class="actions"><button class="primary" type="submit">Salvar livro</button><button class="secondary" type="reset">Limpar</button></div></form><h2>Últimos cadastros</h2><table class="table"><thead><tr><th>Título</th><th>Autor</th><th>Área</th><th>Série</th><th></th></tr></thead><tbody id="adminTable"></tbody></table></div></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
