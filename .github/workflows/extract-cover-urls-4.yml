name: Extract last cover URLs
on:
  push:
    paths: ['.github/workflows/extract-cover-urls-4.yml']
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Extract two Ed McBain covers
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, html
          u='https://www.estantevirtual.com.br/livros/ed-mcbains'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          txt=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','ignore')
          txt=html.unescape(txt).replace('\\u002F','/').replace('\\/','/')
          urls=re.findall(r'https://static\.estantevirtual\.com\.br/book/00/[^"\'<> ]+?_detail1\.jpg\?ts=\d+',txt,re.I)
          for x in dict.fromkeys(urls):
              i=txt.find(x)
              ctx=re.sub(r'\s+',' ',txt[max(0,i-1200):i+1200])
              low=ctx.lower()
              if 'preço de uma vida' in low or 'preco de uma vida' in low or 'homem do saxofone' in low:
                  print('URL',x)
                  print('CTX',ctx[:2400])
                  print('---')
          PY
