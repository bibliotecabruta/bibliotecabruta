name: Extract last cover URLs
on:
  push:
    paths: ['.github/workflows/extract-cover-urls-4.yml']
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact O Preco 1962 product block
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, html, re
          u='https://www.estantevirtual.com.br/livros/ed-mcbains'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          txt=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','ignore')
          txt=html.unescape(txt).replace('\\u002F','/').replace('\\/','/')
          needles=['O Preço de uma Vida: Série 87º Distrito Policial 1409','O Preço de uma Vida: Série','O Preço de uma Vida']
          for n in needles:
              p=txt.find(n)
              if p>=0:
                  print('FOUND',n,'AT',p)
                  ctx=re.sub(r'\s+',' ',txt[max(0,p-2500):p+3500])
                  print(ctx)
                  break
          PY
