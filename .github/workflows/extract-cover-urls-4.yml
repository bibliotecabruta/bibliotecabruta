name: Extract last cover URLs
on:
  push:
    paths: ['.github/workflows/extract-cover-urls-4.yml']
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Saldo 4 Mortos image
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse, html
          u='https://www.traca.com.br/livro/27652/'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          txt=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','ignore')
          txt=html.unescape(txt).replace('\\/','/')
          urls=[]
          urls += re.findall(r'https?://[^"\'<> ]+\.(?:jpg|jpeg|png|webp)(?:\?[^"\'<> ]*)?',txt,re.I)
          rels=re.findall(r'(?:src|href|data-src)=["\']([^"\']+\.(?:jpg|jpeg|png|webp)(?:\?[^"\']*)?)["\']',txt,re.I)
          urls += [urllib.parse.urljoin(u,x) for x in rels]
          for x in dict.fromkeys(urls):
              if any(k in x.lower() for k in ['logo','icon','banner','sprite']): continue
              print(x)
          PY
