name: Extract final cover URLs
on:
  push:
    paths: ['.github/workflows/extract-cover-urls-3.yml']
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Extract individual-page images
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, html
          pages={
            'Quem Matou a Milionaria':'https://sebodomessias.com.br/livro/literatura-estrangeira/quem-matou-a-milionaria-1',
            'Colecao Misterio':'https://sebodomessias.com.br/livro/literatura-estrangeira/misterio-29-volumes-colecao'
          }
          def fetch(u):
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              return urllib.request.urlopen(req,timeout=25).read().decode('utf-8','ignore')
          for name,u in pages.items():
              print('\n###',name)
              txt=html.unescape(fetch(u)).replace('\\u002F','/').replace('\\/','/')
              urls=re.findall(r'https?://[^"\'<> ]+\.(?:jpg|jpeg|png)(?:\?[^"\'<> ]*)?',txt,re.I)
              for x in dict.fromkeys(urls):
                  low=x.lower()
                  if any(k in low for k in ['logo','icon','avatar','loading','placeholder']):continue
                  print(x)
          PY
