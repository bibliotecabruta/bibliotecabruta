name: Extract cover URLs

on:
  push:
    paths:
      - '.github/workflows/extract-cover-urls.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Validate cover images
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, struct
          urls = {
            'Um Cadaver de Luxo':'https://skoob.s3.amazonaws.com/livros/29568/UM_CADAVER_DE_LUXO_1243444187B.jpg',
            'Brincando com a Morte':'https://skoob.s3.amazonaws.com/livros/29567/BRINCANDO_COM_A_MORTE_1243443785B.jpg',
            'Oito Cavalos Negros':'https://skoob.s3.amazonaws.com/livros/50870/OITO_CAVALOS_NEGROS_1253652168B.jpg',
            'O Quebra-Cabeca':'https://skoob.s3.amazonaws.com/livros/362672/O_QUEBRA_CABECA_1459195802362672SK1459195802B.jpg',
            'Fantasmas':'https://skoob.s3.amazonaws.com/livros/125752/FANTASMAS_1518011280125752SK1518011281B.jpg',
          }
          def jpeg_size(data):
              if not data.startswith(b'\xff\xd8'): return None
              i=2
              while i+9 < len(data):
                  if data[i] != 0xFF: i += 1; continue
                  marker=data[i+1]; i += 2
                  if marker in (0xD8,0xD9): continue
                  if i+2>len(data): break
                  ln=int.from_bytes(data[i:i+2],'big')
                  if marker in range(0xC0,0xC4) and marker not in (0xC4,):
                      if i+7<=len(data):
                          h=int.from_bytes(data[i+3:i+5],'big'); w=int.from_bytes(data[i+5:i+7],'big'); return w,h
                  i += ln
              return None
          for name,u in urls.items():
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read()
                      print(f'{name}\tstatus={r.status}\tbytes={len(data)}\tcontent_type={r.headers.get("Content-Type")}\tsize={jpeg_size(data)}\turl={u}')
              except Exception as e:
                  print(f'{name}\tERROR:{e}\turl={u}')
          PY
