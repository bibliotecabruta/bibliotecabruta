name: Descobrir variantes de capa por ISBN

on:
  push:
    paths:
      - 'scripts/discover-collection-cover-variants.py'
      - '.github/workflows/discover-collection-cover-variants.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install pillow requests
      - name: Auditar ISBNs das coleções
        run: python scripts/discover-collection-cover-variants.py
      - name: Commitar relatório
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/collection-cover-discovery-report.json)" ]; then
            echo "Nenhuma mudança."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collection-cover-discovery-report.json
          git commit -m "Atualiza descoberta de variantes por ISBN"
          git pull --rebase origin main
          git push origin main
