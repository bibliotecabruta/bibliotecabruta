name: Fix edition display order
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-edition-order.yml'
permissions:
  contents: write
jobs:
  fix-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invert edition and variant chronology
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('livro.js')
          s = p.read_text(encoding='utf-8')
          old_variant = "(a.publication_year??9999)-(z.publication_year??9999)||String(a.created_at||'').localeCompare(String(z.created_at||''))"
          new_variant = "(z.publication_year??-1)-(a.publication_year??-1)||String(z.created_at||'').localeCompare(String(a.created_at||''))"
          old_editions = "(a.publication_year??9999)-(z.publication_year??9999)||((z.is_primary?1:0)-(a.is_primary?1:0))||String(a.created_at||'').localeCompare(String(z.created_at||''))"
          new_editions = "(z.publication_year??-1)-(a.publication_year??-1)||((z.is_primary?1:0)-(a.is_primary?1:0))||String(z.created_at||'').localeCompare(String(a.created_at||''))"
          if old_variant not in s:
              raise SystemExit('Variant sort pattern not found')
          if old_editions not in s:
              raise SystemExit('Edition sort pattern not found')
          s = s.replace(old_variant, new_variant, 1)
          s = s.replace(old_editions, new_editions, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name 'Biblioteca Bruta Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add livro.js
          git commit -m 'Exibe edições da mais nova para a mais antiga'
          git push
