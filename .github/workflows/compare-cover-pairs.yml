name: Comparar capas
on:
  push:
    paths:
      - 'cover-compare-batch.json'
      - 'scripts/compare-cover-pairs.py'
      - '.github/workflows/compare-cover-pairs.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: python -m pip install --quiet pillow ImageHash
      - name: Comparar
        run: python scripts/compare-cover-pairs.py
      - name: Salvar relatório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cover-compare-results.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
            exit 0
          fi
          git commit -m "Atualiza comparação de capas"
          git pull --rebase origin main
          git push
