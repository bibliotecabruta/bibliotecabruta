name: Localizar lote de capas

on:
  push:
    paths:
      - 'cover-migration-batch.json'
      - 'scripts/localize-cover-batch.mjs'
      - '.github/workflows/localize-cover-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Baixar e validar capas
        run: node scripts/localize-cover-batch.mjs
      - name: Commitar arquivos válidos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp cover-migration-results.json /tmp/cover-migration-results.json
          git restore cover-migration-results.json || true
          git add assets/capas-edicoes
          if ! git diff --cached --quiet; then
            git commit -m "Localiza lote de capas no repositório"
          fi
          git pull --rebase origin main
          cp /tmp/cover-migration-results.json cover-migration-results.json
          git add cover-migration-results.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza relatório de capas"
          fi
          git push
