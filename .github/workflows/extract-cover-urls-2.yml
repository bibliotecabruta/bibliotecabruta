name: Extract remaining cover URLs

on:
  push:
    paths:
      - '.github/workflows/extract-cover-urls-2.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Validate final four covers
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          UA={'User-Agent':'Mozilla/5.0'}
          urls={
            'Um Baile no Matadouro':'https://skoob.s3.amazonaws.com/livros/25323/UM_BAILE_NO_MATADOURO_1255113061B.jpg',
            'Um Corpo no Porao':'https://skoob.s3.amazonaws.com/livros/58027/UM_CORPO_NO_PORAO_1257077329B.jpg',
            'Um Toque de Campainha':'https://static.estantevirtual.com.br/book/00/RSL-3087-000/RSL-3087-000_detail1.jpg?ts=1785500269442',
            'Caso em Familia':'https://static.estantevirtual.com.br/book/00/1NY-4455-000/1NY-4455-000_detail1.jpg?ts=1710472202913',
          }
          def size(data):
              if not data.startswith(b'\xff\xd8'): return None
              i=2
              while i+9<len(data):
                  if data[i]!=255:i+=1;continue
                  marker=data[i+1];i+=2
                  if marker in (0xD8,0xD9):continue
                  ln=int.from_bytes(data[i:i+2],'big')
                  if marker in range(0xC0,0xC4) and marker!=0xC4:
                      return int.from_bytes(data[i+5:i+7],'big'),int.from_bytes(data[i+3:i+5],'big')
                  i+=ln
              return None
          for n,u in urls.items():
              try:
                  req=urllib.request.Request(u,headers=UA)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      d=r.read(); print(n,'STATUS',r.status,'SIZE',size(d),'BYTES',len(d),'URL',u)
              except Exception as e: print(n,'ERROR',repr(e),'URL',u)
          PY
