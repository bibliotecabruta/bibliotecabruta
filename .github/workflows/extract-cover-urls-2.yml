name: Extract remaining cover URLs

on:
  push:
    paths:
      - '.github/workflows/extract-cover-urls-2.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Map Estante images to listings
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, html as htmllib
          UA={'User-Agent':'Mozilla/5.0'}
          pages={
            'Caso em Familia':'https://www.estantevirtual.com.br/busca/caso-em-fam%C3%ADlia',
            'Um Toque de Campainha':'https://www.estantevirtual.com.br/busca/um-toque-de-campainha',
          }
          def fetch(u):
              req=urllib.request.Request(u,headers=UA)
              return urllib.request.urlopen(req,timeout=25).read().decode('utf-8','ignore')
          for name,u in pages.items():
              print('\n###',name)
              txt=htmllib.unescape(fetch(u)).replace('\\u002F','/').replace('\\/','/')
              urls=re.findall(r'https://static\.estantevirtual\.com\.br/book/00/[^"\'<> ]+?_detail1\.jpg\?ts=\d+',txt,re.I)
              seen=[]
              for x in urls:
                  if x in seen: continue
                  seen.append(x)
                  i=txt.find(x)
                  ctx=re.sub(r'\s+',' ',txt[max(0,i-1200):i+1200])
                  print('URL',x)
                  print('CTX',ctx[:2400])
                  print('---')
          PY
