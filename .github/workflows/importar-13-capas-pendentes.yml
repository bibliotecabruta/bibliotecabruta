name: Importar 13 capas pendentes

on:
  push:
    paths:
      - '.github/workflows/importar-13-capas-pendentes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar e normalizar capas
        run: |
          python -m pip install --quiet requests pillow
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import requests
          from PIL import Image

          capas = {
              '686be093-d770-4092-ab43-09b80b4b7abb': 'https://down-br.img.susercontent.com/file/sg-11134201-7ra0u-mbcld2h7fyvl1b',
              '49e6599b-b3a8-48ce-acc8-ae7f23ace68d': 'https://dcdn-us.mitiendanube.com/stores/142/180/products/angus-o-guerreiro-de-deus1-7e4c438cb8781bd21315912807260852-480-0.webp',
              'ceaf82d4-d5f5-4ad5-b73b-1ae0b2131da7': 'https://i0.wp.com/www.touchelivros.com.br/wp-content/uploads/2024/08/9788599170922.jpg?fit=335%2C500&ssl=1',
              '4c51750a-a551-42fe-b0e4-13f09fdffc7b': 'https://i0.wp.com/www.touchelivros.com.br/wp-content/uploads/2025/02/expedicao_a_ilha_mauricio_serie_mestre_dos_mares_4.jpg?fit=300%2C460&ssl=1',
              '09a5597a-80b2-41c6-b00e-0a17f6df6bc3': 'https://skoob.s3.amazonaws.com/livros/13556/HOLOCAUSTO_ASTECA_1234211636B.jpg',
              '038824f7-25e3-4d69-962e-5c6727813b80': 'https://www.europanet.com.br/image_gen/resizeimg.php?cod_produto=100387',
              '0160f7b7-a696-4bd6-bf0a-20a867ae4cad': 'https://www.record.com.br/cdn/shop/files/bf032966d5b71509f2978f554dd7053b_d04c36a8-9119-4f53-99d1-07c46ef345c5_1000x.jpg?v=1783743864',
              'b524efcd-eabd-4794-ac84-f75bc581c32d': 'https://i0.wp.com/www.touchelivros.com.br/wp-content/uploads/2025/02/o_crepusculo_do_mundo.jpg?fit=300%2C448&ssl=1',
              '33db3133-488b-4094-9484-a4cd95bf6472': 'https://i0.wp.com/www.touchelivros.com.br/wp-content/uploads/2024/08/9788501069689.jpg?fit=332%2C500&ssl=1',
              'd8eeb2e6-f408-4785-a7fa-fa947674f541': 'https://acdn-us.mitiendanube.com/stores/001/301/257/products/zy3p1yf-9d69b5ce5fbe7fb00417083711290810-480-0.webp',
              '8ac5b0fe-9cea-40e6-a0c3-baf8824a9965': 'https://rocco.com.br/wp-content/uploads/2026/02/9786555326598-180x270.jpg',
              '7670c2cb-eb19-434e-b58d-994a29f291de': 'https://i0.wp.com/www.touchelivros.com.br/wp-content/uploads/2025/02/orgulho_asteca_astecas_1.jpg?fit=300%2C444&ssl=1',
              '64b45945-2d53-45e1-9828-de9bf48ca27e': 'https://i0.wp.com/www.touchelivros.com.br/wp-content/uploads/2024/11/9788501402172.jpg?fit=1206%2C1816&ssl=1',
          }
          out = Path('assets/capas-edicoes')
          out.mkdir(parents=True, exist_ok=True)
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; BibliotecaBrutaCoverImporter/1.0)'}
          erros = []
          for eid, url in capas.items():
              try:
                  r = requests.get(url, headers=headers, timeout=40)
                  r.raise_for_status()
                  img = Image.open(BytesIO(r.content))
                  img.load()
                  if img.mode != 'RGB':
                      bg = Image.new('RGB', img.size, 'white')
                      if 'A' in img.getbands():
                          bg.paste(img, mask=img.getchannel('A'))
                      else:
                          bg.paste(img)
                      img = bg
                  destino = out / f'{eid}.jpg'
                  img.save(destino, 'JPEG', quality=90, optimize=True)
                  print(f'OK {eid}: {img.width}x{img.height}')
              except Exception as exc:
                  erros.append((eid, url, repr(exc)))
                  print(f'ERRO {eid}: {exc}')
          if erros:
              raise SystemExit('Falharam: ' + '; '.join(e[0] for e in erros))
          PY
      - name: Commitar capas
        run: |
          git config user.name 'Biblioteca Bruta Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/capas-edicoes/*.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Adiciona 13 capas brasileiras pendentes'
          git push
