name: Investigar capa Estante

on:
  push:
    paths:
      - 'scripts/probe-estante-cover.mjs'
      - '.github/workflows/probe-estante-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/probe-estante-cover.mjs
      - name: Commitar relatório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estante-cover-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Registra investigação da capa faltante"
          git push
