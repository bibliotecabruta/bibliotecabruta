name: Atualizar sitemaps dinâmicos

on:
  push:
    paths:
      - 'scripts/generate-sitemaps.mjs'
      - '.github/workflows/update-sitemaps.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar sitemaps
        run: node scripts/generate-sitemaps.mjs
      - name: Commitar alterações
        shell: bash
        run: |
          if git diff --quiet -- sitemap-books.xml sitemap-authors.xml sitemap-series.xml sitemap-categories.xml sitemap-themes.xml sitemap-news.xml; then
            echo "Sitemaps já estão atualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap-books.xml sitemap-authors.xml sitemap-series.xml sitemap-categories.xml sitemap-themes.xml sitemap-news.xml
          git commit -m "Atualiza sitemaps dinâmicos"
          git pull --rebase origin main
          git push origin main
