name: Gerar páginas SEO estáticas

on:
  push:
    paths:
      - 'scripts/generate-seo-pages.mjs'
      - '.github/workflows/generate-seo-pages.yml'
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar páginas estáticas
        run: node scripts/generate-seo-pages.mjs
      - name: Commitar páginas geradas
        shell: bash
        run: |
          if git diff --quiet -- livros series sitemap-books.xml sitemap-series.xml; then
            echo "Páginas SEO já estão atualizadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A livros series sitemap-books.xml sitemap-series.xml
          git commit -m "Atualiza páginas SEO estáticas"
          git pull --rebase origin main
          git push origin main
